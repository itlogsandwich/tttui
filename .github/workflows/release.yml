name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tttui-linux-x86_64.tar.gz
          - name: macos
            os: macos-latest
            archive: tttui-macos.tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: tttui-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tttui
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/tttui dist/
          cp LICENSE README.md dist/
          tar -czf "${{ matrix.archive }}" -C dist .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/tttui.exe dist/
          Copy-Item LICENSE,README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version"
      - run: cargo fmt --check
      - run: cargo check -p tttui
      - run: cargo test -p tttui
      - run: cargo package -p tttui_core
      - run: cargo publish -p tttui_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for tttui_core to become available
        run: |
          for attempt in {1..20}; do
            if cargo search tttui_core --limit 1 | grep -q '^tttui_core = '; then
              exit 0
            fi
            sleep 15
          done
          echo "tttui_core did not become visible on crates.io in time" >&2
          exit 1
      - run: cargo package -p tttui
      - run: cargo publish -p tttui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
