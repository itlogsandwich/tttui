name: Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tttui-linux-x86_64.tar.gz
          - name: macos
            os: macos-latest
            archive: tttui-macos.tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: tttui-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tttui
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/tttui dist/
          cp LICENSE README.md dist/
          tar -czf "${{ matrix.archive }}" -C dist .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/tttui.exe dist/
          Copy-Item LICENSE,README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  upload:
    name: Upload assets
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release if needed
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Release $RELEASE_TAG"
          fi
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
